# ==============================================================================
# Vidhya Praman - Production Nginx Reverse Proxy Configuration
# Optimized for AWS Free Tier EC2 (t2.micro / t3.micro)
# ==============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    
    server_name _; # Responds to public EC2 IP or any domain pointed to it

    # Max upload size for certificates, webcam snapshots, and resumes
    client_max_body_size 50M;

    # Enable Gzip compression for high performance on 1 vCPU
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # --------------------------------------------------------------------------
    # 1. Frontend: High-Performance Static React SPA
    # --------------------------------------------------------------------------
    location / {
        root /var/www/vidhyapraman/frontend/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Static asset caching (JS, CSS, images, fonts)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/vidhyapraman/frontend/dist;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # --------------------------------------------------------------------------
    # 2. FastAPI AI/ML Engine Reverse Proxy (Port 8000)
    # --------------------------------------------------------------------------
    location /fastapi/ {
        rewrite ^/fastapi/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8000;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for DeepSeek / AI model generation
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # --------------------------------------------------------------------------
    # 3. Django Auth & Database Reverse Proxy (Port 8001)
    # --------------------------------------------------------------------------
    location /django/ {
        rewrite ^/django/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8001;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
